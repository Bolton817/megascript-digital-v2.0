# -----------------------------------------------------------------------------
# MegaScript Digital - Netlify Configuration
# Reference: TDD Specification Sheet 113 & 128
# Uses @netlify/plugin-nextjs (OpenNext adapter) for App Router serverless execution
# -----------------------------------------------------------------------------

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security Headers Baseline
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Canonical Apex Domain & HTTPS Redirects (TDD Sheet 116 / Sheet 128)
[[redirects]]
  from = "https://www.megascriptdigital.co.ke/*"
  to = "https://megascriptdigital.co.ke/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.megascriptdigital.co.ke/*"
  to = "https://megascriptdigital.co.ke/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://megascriptdigital.co.ke/*"
  to = "https://megascriptdigital.co.ke/:splat"
  status = 301
  force = true

